[project]
name = "pkg-ext"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "ask-shell",
  "GitPython",
  "model-lib[toml]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pkg-ext = "pkg_ext.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "pkg_ext/*.py",
]
exclude = [
  "*_test.py",
  "conftest.py",
  "test_*.json",
]
