[project]
name = "pkg-ext"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "ask-shell",
  "GitPython",
  "model-lib[toml]",
  "tomlkit>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pkg-ext = "pkg_ext.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "pkg_ext/*.py",
]
exclude = [
  "*_test.py",
  "conftest.py",
  "test_*.json",
]

[tool.uv.sources]
ask-shell = { path = "../../ask-shell", editable = true }
model-lib = { path = "../../model-lib", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
