[project]
name = "path-sync"
version = "0.2.1"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
license = "MIT"
keywords = []
authors = [{ name = "EspenAlbert", email = "espen.albert1@gmail.com" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.16.0",
    "gitpython>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "path_sync/*.py",
]
exclude = [
  "*_test.py",
  "conftest.py",
  "test_*.json",
]

[project.scripts]
path-sync = "path_sync.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]
